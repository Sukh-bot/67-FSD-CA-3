services:
  - type: web
    name: petcare-fullstack-api
    env: node
    plan: free
    region: frankfurt
    rootDir: Program-5-FullStack-Integration/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: petcare-postgres-db
          property: connectionString

databases:
  - name: petcare-postgres-db
    plan: free
    region: frankfurt
    databaseName: petcare_db
    user: petcare_admin
